<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fenrir-TS - Monaco Editor Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="m-0 p-0 overflow-hidden bg-gray-950 font-sans">
    <div class="flex w-screen h-screen">
      <!-- Editor Panel -->
      <div class="w-1/2 h-screen border-r-2 border-gray-800">
        <div id="editor-container" class="w-full h-full"></div>
      </div>

      <!-- Game Preview Panel -->
      <div class="w-1/2 h-screen relative">
        <div
          id="info"
          class="absolute top-2.5 left-2.5 text-white bg-black/70 p-2.5 rounded z-100 text-sm"
        ></div>
        <div id="nav" class="absolute top-2.5 right-2.5 z-100"></div>
        <canvas id="canvas" class="w-full h-full block"></canvas>

        <!-- Web Components Controls -->
        <div
          class="absolute bottom-5 left-1/2 transform -translate-x-1/2 z-100"
        >
          <ed-control-bar></ed-control-bar>
        </div>

        <!-- Error Modal -->
        <ed-error-modal></ed-error-modal>
      </div>
    </div>
    <script type="module" src="/src/demos/monaco/index.ts"></script>
  </body>
</html>
