<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fenrir-TS - Monaco Editor Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1e1e1e;
        font-family: Arial, sans-serif;
      }
      #container {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      #editor-container {
        width: 50%;
        height: 100vh;
        border-right: 2px solid #333;
      }
      #game-container {
        width: 50%;
        height: 100vh;
        position: relative;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 100;
      }
      #nav {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 100;
      }
      #nav a {
        color: white;
        text-decoration: none;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        border-radius: 4px;
        margin-left: 5px;
      }
      #nav a:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      #nav a.active {
        background: rgba(0, 100, 200, 0.8);
      }
      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.9);
        padding: 15px;
        border-radius: 8px;
        z-index: 100;
        align-items: center;
      }
      .control-btn {
        background: #2d2d30;
        border: 1px solid #555;
        color: #fff;
        padding: 10px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }
      .control-btn:hover:not(:disabled) {
        background: #007acc;
        border-color: #007acc;
      }
      .control-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .control-btn .icon {
        font-size: 16px;
      }
      #status {
        color: #4ec9b0;
        font-weight: bold;
        padding: 0 10px;
        font-size: 14px;
        border-left: 2px solid #555;
        margin-left: 5px;
      }
      #error-panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #1e1e1e;
        border: 2px solid #f48771;
        border-radius: 8px;
        padding: 20px;
        max-width: 600px;
        max-height: 400px;
        overflow: auto;
        z-index: 200;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      #error-panel.hidden {
        display: none;
      }
      .error-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #555;
      }
      .error-header .title {
        color: #f48771;
        font-weight: bold;
        font-size: 16px;
      }
      #btn-close-error {
        background: none;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        padding: 0;
        width: 24px;
        height: 24px;
      }
      #btn-close-error:hover {
        color: #f48771;
      }
      #error-message {
        color: #d4d4d4;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 13px;
        white-space: pre-wrap;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="editor-container"></div>
      <div id="game-container">
        <div id="info"></div>
        <div id="nav"></div>
        <canvas id="canvas"></canvas>
        <div id="controls">
          <button id="btn-start" class="control-btn">
            <span class="icon">▶</span> Start
          </button>
          <button id="btn-pause" class="control-btn" disabled>
            <span class="icon">⏸</span> Pause
          </button>
          <button id="btn-resume" class="control-btn" disabled>
            <span class="icon">▶</span> Resume
          </button>
          <button id="btn-restart" class="control-btn" disabled>
            <span class="icon">⏹</span> Restart
          </button>
          <button id="btn-save" class="control-btn">
            <span class="icon">💾</span> Save (Ctrl+S)
          </button>
          <div id="status">Stopped</div>
        </div>
        <div id="error-panel" class="error-panel hidden">
          <div class="error-header">
            <span class="icon">⚠️</span>
            <span class="title">Error</span>
            <button id="btn-close-error">✕</button>
          </div>
          <pre id="error-message"></pre>
        </div>
      </div>
    </div>
    <script type="module" src="/src/demos/monaco/index.ts"></script>
  </body>
</html>
