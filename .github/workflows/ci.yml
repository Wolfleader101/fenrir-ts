name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          version: '12.18.0'
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      - name: Check documented examples compile
        run: pnpm check:docs
      - name: Check the shipped agent docs and API reference are regenerated
        run: pnpm check:agent-docs
      - name: Test
        run: pnpm test:run
      - name: Build the library
        run: pnpm build:lib
      - name: Check bundle size budget
        run: pnpm check:size
      - name: Check entries load only their own peers (core loads none)
        run: pnpm check:imports
      - name: Check what a consumer ships stays within budget (fixture games bundled with Vite)
        run: pnpm check:consumer
      - name: Check the published tarball (allowed files, size, manifest, publint, attw)
        run: pnpm check:package
