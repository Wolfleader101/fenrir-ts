name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The lockfile uses pnpm 10's manifest overrides, and pnpm/setup installs
      # pnpm 11 or newer, so pnpm 10 is run through dlx.
      PNPM10: pnpm dlx pnpm@10.32.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          version: '12.18.0'
          runtime: node@24
          install: false
      - name: Install dependencies
        run: $PNPM10 install --frozen-lockfile --ignore-scripts --node-linker hoisted
      - name: Type-check
        run: $PNPM10 run type-check
      - name: Check documented examples compile
        run: $PNPM10 run check:docs
      - name: Test
        run: $PNPM10 run test:run
      - name: Build the library
        run: $PNPM10 run build:lib
      - name: Check bundle size budget
        run: $PNPM10 run check:size
