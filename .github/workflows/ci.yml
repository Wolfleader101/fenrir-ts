name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          # The lockfile uses pnpm 10's manifest overrides.
          version: '10.32.1'
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --node-linker hoisted
      - name: Type-check
        run: pnpm type-check
      - name: Check documented examples compile
        run: pnpm check:docs
      - name: Test
        run: pnpm test:run
      - name: Build the library
        run: pnpm build:lib
      - name: Check bundle size budget
        run: pnpm check:size
